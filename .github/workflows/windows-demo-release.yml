name: Windows MSIX production candidate

on:
  workflow_dispatch:
    inputs:
      request_path:
        description: Reviewed release-requests/windows-msix JSON path
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: quickhack-windows-msix-production-candidate
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.request.outputs.version }}
      tag: ${{ steps.request.outputs.tag }}
      source_commit: ${{ steps.request.outputs.source_commit }}
      publisher: ${{ steps.request.outputs.publisher }}
      signing_provider: ${{ steps.request.outputs.signing_provider }}
      integration_run_id: ${{ steps.integration.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
      - name: Validate immutable Windows release request
        id: request
        env:
          QUICKHACK_REQUEST_PATH: ${{ inputs.request_path }}
        shell: bash
        run: node packaging/windows/msix/windows-release-request.mjs --request-path="$QUICKHACK_REQUEST_PATH"
      - name: Require Azure provider in the GitHub-hosted candidate lane
        env:
          QUICKHACK_SIGNING_PROVIDER: ${{ steps.request.outputs.signing_provider }}
          QUICKHACK_SOURCE_COMMIT: ${{ steps.request.outputs.source_commit }}
        shell: bash
        run: |
          [[ "$QUICKHACK_SIGNING_PROVIDER" == "AZURE_ARTIFACT_SIGNING" ]]
          git cat-file -e "$QUICKHACK_SOURCE_COMMIT^{commit}"
      - name: Resolve successful same-revision Final Integration run
        id: integration
        env:
          GH_TOKEN: ${{ github.token }}
          QUICKHACK_SOURCE_COMMIT: ${{ steps.request.outputs.source_commit }}
        shell: bash
        run: |
          run_id="$(gh run list --workflow pull-request-checks.yml --commit "$QUICKHACK_SOURCE_COMMIT" --status success --json databaseId,headSha --limit 20 --jq ".[] | select(.headSha == \"$QUICKHACK_SOURCE_COMMIT\") | .databaseId" | head -n 1)"
          [[ "$run_id" =~ ^[0-9]+$ ]]
          echo "run_id=$run_id" >>"$GITHUB_OUTPUT"

  sign:
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 45
    environment: quickhack-production-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: final-integration-complete
          path: release/final-integration
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.integration_run_id }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-msix-exact-four-unsigned
          path: release/distribution/windows/msix/exact-four
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.integration_run_id }}
      - name: Verify exact unsigned production input
        env:
          QUICKHACK_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          QUICKHACK_MSIX_PUBLISHER: ${{ needs.prepare.outputs.publisher }}
        shell: pwsh
        run: >-
          node packaging/windows/msix/four-artifact-distribution.mjs
          --directory=release/distribution/windows/msix/exact-four
          --version="$env:QUICKHACK_RELEASE_VERSION"
          --publisher="$env:QUICKHACK_MSIX_PUBLISHER"
          --require-unsigned
      - name: Azure login with OIDC
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Apply public-trust Artifact Signing signature and RFC 3161 timestamp
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\release\distribution\windows\msix\exact-four
          files-folder-filter: msix
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
          trace: false
      - name: Finalize production signature, provenance, and compiled icon evidence
        env:
          QUICKHACK_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          QUICKHACK_MSIX_PUBLISHER: ${{ needs.prepare.outputs.publisher }}
        shell: pwsh
        run: >-
          ./packaging/windows/msix/sign-msix.ps1
          -Provider AzureArtifactSigning
          -Version "$env:QUICKHACK_RELEASE_VERSION"
          -Publisher "$env:QUICKHACK_MSIX_PUBLISHER"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-msix-production-candidate-${{ needs.prepare.outputs.version }}
          path: release/distribution/windows/msix/exact-four/
          if-no-files-found: error
          retention-days: 30
