name: Final integration gate

# D-009: PR labels are work/review units, not execution blockers. This full
# workflow is dispatched once after every planned PR stage is complete.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to build and later publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: quickhack-final-integration
  cancel-in-progress: false

jobs:
  source-and-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      QUICKHACK_TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      QUICKHACK_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      QUICKHACK_TEST_MIGRATOR_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      QUICKHACK_TEST_BACKUP_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      QUICKHACK_TEST_COUPANG_MOCK_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      QUICKHACK_TEST_LOGEN_MOCK_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        shell: pwsh
        run: ./.github/scripts/run-gitleaks.ps1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run audit:dependencies
      - run: npm run lint
      - name: Run source and PostgreSQL gate once
        run: npm run verify:postgresql

  windows-package-matrix:
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [demo-server, demo-client, operational-server, operational-client]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install Windows package toolchain
        shell: pwsh
        run: |
          choco install postgresql18 --version=18.4.0 -y --no-progress
          choco install innosetup -y --no-progress
          "QUICKHACK_RELEASE_POSTGRESQL_ROOT=$env:ProgramFiles\PostgreSQL\18" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm ci
      - name: Build selected Windows package
        env:
          HOME: ${{ runner.temp }}\home
          LOCALAPPDATA: ${{ runner.temp }}\local-app-data
          USERPROFILE: ${{ runner.temp }}\user-profile
        shell: pwsh
        run: |
          npm run build
          $env:QUICKHACK_NODE_RUNTIME_DIR = Split-Path -Parent (Get-Command node).Source
          npm run "stage:windows:${{ matrix.target }}" -- "--postgresql-runtime-dir=$env:QUICKHACK_RELEASE_POSTGRESQL_ROOT"
          npm run "release:windows:${{ matrix.target }}" -- -Version "${{ inputs.version }}"
      - name: Verify selected Windows release artifact
        shell: pwsh
        run: >-
          node tools/verify-package-release-artifact.mjs
          --artifact-dir=release/distribution/windows/${{ matrix.target }}
          --platform=windows
          --target=${{ matrix.target }}
          --release-version=${{ inputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.target }}
          path: release/distribution/windows/${{ matrix.target }}/
          if-no-files-found: error

  linux-package-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        target: [demo-server, demo-client, operational-server, operational-client]
    steps:
      - name: Install Arch build toolchain
        run: pacman -Syu --noconfirm base-devel git nodejs-lts-krypton npm postgresql android-tools cups sudo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare unprivileged makepkg user
        run: useradd --create-home builder && chown -R builder:builder "$GITHUB_WORKSPACE"
      - run: sudo -u builder npm ci
      - run: sudo -u builder npm run build
      - run: sudo -u builder npm run "release:linux:${{ matrix.target }}" -- --version="${{ inputs.version }}"
      - name: Verify selected Arch release artifact
        run: >-
          sudo -u builder node tools/verify-package-release-artifact.mjs
          --artifact-dir=release/distribution/linux/${{ matrix.target }}
          --platform=linux
          --target=${{ matrix.target }}
          --release-version=${{ inputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}
          path: release/distribution/linux/${{ matrix.target }}/
          if-no-files-found: error

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - working-directory: quickhack_android
        run: bash ./gradlew testDebugUnitTest assembleDebug --no-daemon

  final-integration-complete:
    if: always()
    needs:
      - source-and-postgresql
      - windows-package-matrix
      - linux-package-matrix
      - android-build
    runs-on: ubuntu-latest
    steps:
      - name: Require every automated integration gate
        env:
          SOURCE_RESULT: ${{ needs.source-and-postgresql.result }}
          WINDOWS_RESULT: ${{ needs.windows-package-matrix.result }}
          LINUX_RESULT: ${{ needs.linux-package-matrix.result }}
          ANDROID_RESULT: ${{ needs.android-build.result }}
        run: |
          [[ "$SOURCE_RESULT" == "success" ]]
          [[ "$WINDOWS_RESULT" == "success" ]]
          [[ "$LINUX_RESULT" == "success" ]]
          [[ "$ANDROID_RESULT" == "success" ]]
