name: Final integration gate

# D-009: PR labels are work/review units, not execution blockers. This full
# workflow is dispatched once after every planned PR stage is complete.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to build and later publish
        required: true
        type: string
      windows_publisher:
        description: Exact production or integration X.500 MSIX Publisher
        required: true
        default: "CN=QuickHack Integration, O=QuickHack"
        type: string
      scope:
        description: Full gate or focused recovery of selected failed lanes
        required: true
        default: all
        type: choice
        options: [all, source-linux, source]

permissions:
  contents: read

concurrency:
  group: quickhack-final-integration
  cancel-in-progress: false

jobs:
  source-and-postgresql:
    if: inputs.scope == 'all' || inputs.scope == 'source-linux' || inputs.scope == 'source'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      QUICKHACK_TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      QUICKHACK_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      QUICKHACK_TEST_MIGRATOR_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      QUICKHACK_TEST_BACKUP_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      QUICKHACK_TEST_COUPANG_MOCK_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      QUICKHACK_TEST_LOGEN_MOCK_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        shell: pwsh
        run: ./.github/scripts/run-gitleaks.ps1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: npm
      - name: Pin npm toolchain
        run: npm install --global npm@12.0.2 && npm --version | grep -Fx 12.0.2
      - run: npm ci
      - run: npm run audit:dependencies
      - run: npm run lint
      - name: Run source and PostgreSQL gate once
        run: npm run verify:postgresql

  windows-msix-package-set:
    if: inputs.scope == 'all'
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: npm
      - name: Acquire pinned PostgreSQL 18 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $config = Get-Content packaging/windows/postgresql-runtime.json -Raw | ConvertFrom-Json
          $archive = Join-Path $env:RUNNER_TEMP $config.archiveFile
          $extractRoot = Join-Path $env:RUNNER_TEMP "quickhack-postgresql-runtime"
          Invoke-WebRequest -UseBasicParsing -Uri $config.downloadUrl -OutFile $archive
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actualHash -ne $config.archiveSha256) { throw "Pinned PostgreSQL archive checksum mismatch." }
          Expand-Archive -LiteralPath $archive -DestinationPath $extractRoot -Force
          $postgresqlRoot = Join-Path $extractRoot "pgsql"
          if (-not (Test-Path -LiteralPath (Join-Path $postgresqlRoot "bin\postgres.exe") -PathType Leaf)) {
            throw "Pinned PostgreSQL archive layout is invalid."
          }
          "QUICKHACK_RELEASE_POSTGRESQL_ROOT=$postgresqlRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Pin npm toolchain
        shell: pwsh
        run: |
          npm install --global npm@12.0.2
          if ((npm --version) -ne "12.0.2") { throw "Expected npm 12.0.2." }
      - run: npm ci
      - name: Build and stage exact four Windows artifacts once
        env:
          HOME: ${{ runner.temp }}\home
          LOCALAPPDATA: ${{ runner.temp }}\local-app-data
          USERPROFILE: ${{ runner.temp }}\user-profile
          QUICKHACK_RELEASE_VERSION: ${{ inputs.version }}
          QUICKHACK_MSIX_PUBLISHER: ${{ inputs.windows_publisher }}
        shell: pwsh
        run: |
          npm run build
          ./packaging/stage-windows-four-artifacts.ps1 `
            -PostgresqlRuntimeDir $env:QUICKHACK_RELEASE_POSTGRESQL_ROOT `
            -PlatformToolsDir (Join-Path $env:ANDROID_SDK_ROOT "platform-tools") `
            -RequirePlatformTools
          ./packaging/build-msix-four-artifacts.ps1 `
            -Version $env:QUICKHACK_RELEASE_VERSION `
            -Publisher $env:QUICKHACK_MSIX_PUBLISHER `
            -SigningMode Unsigned
      - name: Verify exact unsigned MSIX set
        shell: pwsh
        env:
          QUICKHACK_RELEASE_VERSION: ${{ inputs.version }}
          QUICKHACK_MSIX_PUBLISHER: ${{ inputs.windows_publisher }}
        run: >-
          node packaging/windows/msix/four-artifact-distribution.mjs
          --directory=release/distribution/windows/msix/exact-four
          --version="$env:QUICKHACK_RELEASE_VERSION"
          --publisher="$env:QUICKHACK_MSIX_PUBLISHER"
          --require-unsigned
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-msix-exact-four-unsigned
          path: release/distribution/windows/msix/exact-four/
          if-no-files-found: error
          retention-days: 30

  linux-package-set:
    if: inputs.scope == 'all' || inputs.scope == 'source-linux'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container: archlinux:latest
    env:
      NODE_ENV: test
      QUICKHACK_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      QUICKHACK_TEST_MIGRATOR_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - name: Install Arch build toolchain
        run: |
          pacman -Syu --noconfirm base-devel git nodejs-lts-krypton npm postgresql android-tools cups sudo
          npm install --global npm@12.0.2
          npm --version | grep -Fx 12.0.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare unprivileged makepkg user
        run: useradd --create-home builder && chown -R builder:builder "$GITHUB_WORKSPACE"
      - run: >-
          sudo -u builder env
          NODE_ENV="$NODE_ENV"
          QUICKHACK_TEST_DATABASE_URL="$QUICKHACK_TEST_DATABASE_URL"
          QUICKHACK_TEST_MIGRATOR_DATABASE_URL="$QUICKHACK_TEST_MIGRATOR_DATABASE_URL"
          npm ci
      - run: >-
          sudo -u builder env
          NODE_ENV="$NODE_ENV"
          QUICKHACK_TEST_DATABASE_URL="$QUICKHACK_TEST_DATABASE_URL"
          QUICKHACK_TEST_MIGRATOR_DATABASE_URL="$QUICKHACK_TEST_MIGRATOR_DATABASE_URL"
          npm run build
      - name: Build and verify exact four Linux packages once
        env:
          QUICKHACK_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          sudo -u builder env NODE_ENV="$NODE_ENV" \
            npm run release:linux:demo-server -- --version="$QUICKHACK_RELEASE_VERSION"
          for target in demo-server demo-client operational-server operational-client; do
            sudo -u builder node tools/verify-package-release-artifact.mjs \
              --artifact-dir="release/distribution/linux/$target" \
              --platform=linux \
              --target="$target" \
              --release-version="$QUICKHACK_RELEASE_VERSION"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-demo-server
          path: release/distribution/linux/demo-server/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-demo-client
          path: release/distribution/linux/demo-client/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-operational-server
          path: release/distribution/linux/operational-server/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-operational-client
          path: release/distribution/linux/operational-client/
          if-no-files-found: error

  android-build:
    if: inputs.scope == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - working-directory: quickhack_android
        run: bash ./gradlew testDebugUnitTest assembleDebug --no-daemon

  final-integration-complete:
    if: always()
    needs:
      - source-and-postgresql
      - windows-msix-package-set
      - linux-package-set
      - android-build
    runs-on: ubuntu-latest
    steps:
      - name: Require every automated integration gate
        env:
          INTEGRATION_SCOPE: ${{ inputs.scope }}
          SOURCE_RESULT: ${{ needs.source-and-postgresql.result }}
          WINDOWS_RESULT: ${{ needs.windows-msix-package-set.result }}
          LINUX_RESULT: ${{ needs.linux-package-set.result }}
          ANDROID_RESULT: ${{ needs.android-build.result }}
        run: |
          [[ "$SOURCE_RESULT" == "success" ]]
          if [[ "$INTEGRATION_SCOPE" == "all" ]]; then
            [[ "$LINUX_RESULT" == "success" ]]
            [[ "$WINDOWS_RESULT" == "success" ]]
            [[ "$ANDROID_RESULT" == "success" ]]
          else
            [[ "$WINDOWS_RESULT" == "skipped" ]]
            [[ "$ANDROID_RESULT" == "skipped" ]]
            if [[ "$INTEGRATION_SCOPE" == "source-linux" ]]; then
              [[ "$LINUX_RESULT" == "success" ]]
            else
              [[ "$INTEGRATION_SCOPE" == "source" ]]
              [[ "$LINUX_RESULT" == "skipped" ]]
            fi
          fi
      - name: Record full-integration release eligibility
        if: inputs.scope == 'all'
        run: |
          mkdir -p release/final-integration
          printf '%s\n' "$GITHUB_SHA" > release/final-integration/source-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: inputs.scope == 'all'
        with:
          name: final-integration-complete
          path: release/final-integration/source-commit.txt
          if-no-files-found: error
