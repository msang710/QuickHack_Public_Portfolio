name: Windows four-artifact release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version of the successful Final Integration artifact to verify
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  windows-release-matrix:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    strategy:
      fail-fast: false
      matrix:
        target: [demo-server, demo-client, operational-server, operational-client]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
      - name: Resolve successful same-revision Final Integration run
        id: integration
        shell: pwsh
        run: |
          $runs = gh run list --workflow pull-request-checks.yml --commit "$env:GITHUB_SHA" --status success --json databaseId,headSha --limit 20 | ConvertFrom-Json
          $run = $runs | Where-Object { $_.headSha -eq $env:GITHUB_SHA } | Select-Object -First 1
          if (-not $run) { throw "No successful Final Integration run exists for $env:GITHUB_SHA." }
          "run_id=$($run.databaseId)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Download exact verified Windows package
        uses: actions/download-artifact@v4
        with:
          name: windows-${{ matrix.target }}
          path: release/distribution/windows/${{ matrix.target }}
          github-token: ${{ github.token }}
          run-id: ${{ steps.integration.outputs.run_id }}
      - name: Verify package manifest, version, target, and hashes
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
        run: >-
          node tools/verify-package-release-artifact.mjs
          --release-version="$env:RELEASE_VERSION"
          --artifact-dir=release/distribution/windows/${{ matrix.target }}
          --platform=windows
          --target=${{ matrix.target }}
      - name: Publish tag artifacts
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $artifacts = Get-ChildItem -LiteralPath "release\distribution\windows\${{ matrix.target }}" -File
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --verify-tag --title $tag --generate-notes
            if ($LASTEXITCODE -ne 0) {
              gh release view $tag *> $null
              if ($LASTEXITCODE -ne 0) { throw "Unable to create or observe release $tag." }
            }
          }
          gh release upload $tag $artifacts.FullName --clobber
